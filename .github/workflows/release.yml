name: release

# Release of Weaver to GitHub Releases (requirements/release#General, specs#deployment).
#
# It starts only when `ci` completed with success on a push to `main`, and works on that run's
# `head_sha`: never for `dev` or a pull request, never on a commit whose tests failed.
#
#   prepare   reads the version of src-tauri/tauri.conf.json; ends with a notice when the tag
#             v<version> exists, otherwise creates the draft release `Weaver v<version>`
#             (a draft does not create the tag)
#   build     one job per platform: tauri-action builds the bundles and uploads them to the draft
#   manifest  checks the files of the draft and attaches the updater manifest latest.json
#   publish   only when every build job succeeded: publishes the draft, which creates the tag
#             v<version> on head_sha
#   discard   when a build job failed or was cancelled: deletes the draft; no tag is ever created
#
# Nothing here moves, deletes or recreates a tag, or edits a release that is already published.
# Builds are not signed or notarised by the operating systems' standards yet; the updater files are
# signed with the Tauri updater key (secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD, public key in tauri.conf.json).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# Two pushes to main in a row release one after the other, never at the same time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: prepare
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      build: ${{ steps.tag.outputs.build }}
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Read the version
        id: version
        run: |
          version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          case "$version" in
            ''|null|*[!0-9A-Za-z.+-]*) echo "::error::src-tauri/tauri.conf.json has no usable version"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Look for the tag on origin
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A failure of ls-remote fails the step: a tag that could not be looked up is not a tag that is absent.
          found="$(git ls-remote --tags origin "refs/tags/v${VERSION}")"
          if [ -n "$found" ]; then
            echo "::notice::Release of v${VERSION} skipped: the tag v${VERSION} exists. The push to main only ran the tests."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: The signing prerequisites are in place
        if: steps.tag.outputs.build == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          failed=0
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the secret TAURI_SIGNING_PRIVATE_KEY is not set: the updater files cannot be signed"
            failed=1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::the secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set"
            failed=1
          fi
          if [ -z "$(jq -r '.plugins.updater.pubkey // ""' src-tauri/tauri.conf.json)" ]; then
            echo "::error::plugins.updater.pubkey of src-tauri/tauri.conf.json is empty: installed copies could not verify updates"
            failed=1
          fi
          if [ "$(jq -r '.bundle.createUpdaterArtifacts' src-tauri/tauri.conf.json)" != "true" ]; then
            echo "::error::bundle.createUpdaterArtifacts of src-tauri/tauri.conf.json is not true"
            failed=1
          fi
          exit "$failed"

      - name: Create the draft release
        id: draft
        if: steps.tag.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A draft left by a run that did not finish is replaced. A release that is already
          # published is never touched: it stops this run.
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"v${VERSION}\") | \"\(.id) \(.draft)\"")"
          while read -r id draft; do
            [ -n "$id" ] || continue
            if [ "$draft" != "true" ]; then
              echo "::error::a published release for v${VERSION} exists but its tag does not; it is not edited"
              exit 1
            fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done <<< "$existing"

          node scripts/release.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="v${VERSION}" \
            -f target_commitish="$HEAD_SHA" \
            -f name="Weaver v${VERSION}" \
            -F body=@"$RUNNER_TEMP/notes.md" \
            -F draft=true \
            -F prerelease=false \
            --jq '.id')"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    if: ${{ needs.prepare.outputs.build == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: windows-x64
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: linux-x64
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
    steps:
      - name: Install the Tauri system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # The toolchains are pinned in the repository: rust-toolchain.toml, .nvmrc and `packageManager`.
      - name: Read the pinned toolchain versions
        id: pins
        run: |
          rust="$(sed -n 's/^channel *= *"\(.*\)" *$/\1/p' rust-toolchain.toml | tr -d '\r')"
          node="$(tr -d '\r\n ' < .nvmrc)"
          pnpm="$(sed -n 's/.*"packageManager": *"pnpm@\([^"]*\)".*/\1/p' package.json | tr -d '\r')"
          for pin in rust node pnpm; do
            if [ -z "${!pin}" ]; then echo "::error::no pinned $pin version found"; exit 1; fi
          done
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "pnpm=$pnpm" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4

      - name: Install the Rust toolchain of rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version
          case "$(rustc --version)" in
            "rustc ${{ steps.pins.outputs.rust }} "*) ;;
            *) echo "::error::rustc is not the pinned version ${{ steps.pins.outputs.rust }}"; exit 1 ;;
          esac
          rustup target add ${{ matrix.rust-targets }}

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the JS package store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.pins.outputs.node }}-pnpm-${{ steps.pins.outputs.pnpm }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache the Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-cargo-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.pins.outputs.rust }}-${{ matrix.rust-targets }}-${{ hashFiles('Cargo.lock') }}

      - name: Install the JS dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      # `weaver-cli` is built for the same target as the app and bundled as its sidecar: src-tauri/build.rs
      # does it for each target Cargo builds the app for. The universal macOS app needs one more file,
      # `binaries/weaver-cli-universal-apple-darwin`: the arm64 and x64 builds joined with lipo. They are
      # built into the folder build.rs uses (target/sidecar), so build.rs finds them up to date.
      - name: Join the arm64 and x64 builds of weaver-cli with lipo (macOS)
        if: runner.os == 'macOS'
        run: |
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --package weaver-cli --bin weaver-cli --target "$triple" --target-dir target/sidecar
          done
          mkdir -p src-tauri/binaries
          lipo -create -output src-tauri/binaries/weaver-cli-universal-apple-darwin \
            target/sidecar/aarch64-apple-darwin/release/weaver-cli \
            target/sidecar/x86_64-apple-darwin/release/weaver-cli
          chmod +x src-tauri/binaries/weaver-cli-universal-apple-darwin
          lipo -info src-tauri/binaries/weaver-cli-universal-apple-darwin

      - name: Build the bundles and upload them to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # latest.json is made once, by the manifest job, from the files all three builds uploaded.
          includeUpdaterJson: false

  manifest:
    name: manifest
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.build == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: The draft holds every file the release notes name
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.assets' > "$RUNNER_TEMP/assets.json"
          node scripts/release.mjs verify "$VERSION" "$RUNNER_TEMP/assets.json"

      - name: Make latest.json from the signatures of the updater files
        run: |
          mkdir -p "$RUNNER_TEMP/signatures"
          jq -r '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' "$RUNNER_TEMP/assets.json" |
            while read -r id name; do
              gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > "$RUNNER_TEMP/signatures/${name}"
            done
          node scripts/release.mjs manifest "$VERSION" "$RUNNER_TEMP/assets.json" "$RUNNER_TEMP/signatures" "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"

      - name: Attach latest.json to the draft
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            --data-binary "@${RUNNER_TEMP}/latest.json" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=latest.json" > /dev/null

  # Runs only when prepare, every build job and manifest succeeded.
  publish:
    name: publish
    needs: [prepare, build, manifest]
    if: ${{ needs.prepare.outputs.build == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Only a draft is published, and only when the tag is still free
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')" != "true" ]; then
            echo "::error::the release is not a draft any more; it is not edited"
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            echo "::error::the tag v${VERSION} appeared while the release was built; it is not moved"
            exit 1
          fi

      # Publishing the draft creates the tag v<version> on the commit the draft was made for.
      - name: Publish the release
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -f make_latest=true --jq '.html_url'

      - name: The tag is on head_sha
        run: |
          found="$(git ls-remote --tags origin "refs/tags/v${VERSION}" | cut -f1)"
          if [ "$found" != "$HEAD_SHA" ]; then
            echo "::error::the tag v${VERSION} is on '${found}', not on ${HEAD_SHA}"
            exit 1
          fi

  # Runs when a build job or manifest failed or was cancelled: the draft is deleted, so no release
  # and no tag are left (a draft has no tag).
  discard:
    name: discard
    needs: [prepare, build, manifest]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.build == 'true' && (needs.build.result != 'success' || needs.manifest.result != 'success') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - name: Delete the draft release
        run: |
          if draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft' 2>"$RUNNER_TEMP/error.txt")"; then :; else
            if grep -q 'HTTP 404' "$RUNNER_TEMP/error.txt"; then draft=gone; else cat "$RUNNER_TEMP/error.txt"; exit 1; fi
          fi
          case "$draft" in
            true)
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
              echo "::notice::A build failed or was cancelled: the draft release was deleted and no tag was created."
              ;;
            gone) echo "::notice::The draft release is already gone." ;;
            *) echo "::error::the release is not a draft; it is not deleted"; exit 1 ;;
          esac
